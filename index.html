<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quake map — live earthquakes, plotted</title>
<meta name="description" content="Live earthquakes from the USGS feed on a world map, circles scaled by magnitude.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#fafafa; --surface:#ffffff; --ink:#171717; --ink-2:#5c5c5c; --ink-3:#8a8a8a;
    --line:#e4e4e0; --accent:#1d4ed8;
    --shadow:0 1px 2px rgba(0,0,0,.05);
  }
  html[data-theme="dark"]{
    --bg:#101012; --surface:#17171a; --ink:#ededea; --ink-2:#a3a3a0; --ink-3:#6f6f6c;
    --line:#26262b; --accent:#6d9bff;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    padding:22px 28px 0; max-width:1180px; width:100%; margin:0 auto;
  }
  .brand h1{font-size:20px; font-weight:700; letter-spacing:-.02em}
  .brand h1 .mono{font-family:'IBM Plex Mono',monospace; font-weight:500; color:var(--ink-3); font-size:13px; margin-left:8px}
  .brand p{font-size:13px; color:var(--ink-2); margin-top:3px}
  .theme-btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
    border-radius:999px; padding:7px 14px; font:500 12.5px 'Inter',sans-serif; cursor:pointer;
    box-shadow:var(--shadow); white-space:nowrap;
  }
  .theme-btn:hover{border-color:var(--ink-3)}
  main{flex:1; display:flex; flex-direction:column; max-width:1180px; width:100%; margin:0 auto; padding:18px 28px 28px}
  .toolbar{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; box-shadow:var(--shadow); margin-bottom:14px; z-index:1000;
  }
  .seg{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
  .seg button{
    border:none; background:var(--bg); color:var(--ink-2); padding:8px 13px;
    font:500 12.5px 'Inter',sans-serif; cursor:pointer; border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--accent); color:#fff}
  .slider-wrap{display:flex; align-items:center; gap:8px; padding:0 6px}
  .slider-wrap label{font:500 11px 'IBM Plex Mono',monospace; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em}
  .slider-wrap output{font:600 12px 'IBM Plex Mono',monospace; color:var(--ink-2); min-width:36px}
  input[type=range]{accent-color:var(--accent); width:110px; cursor:pointer}
  .count{font:500 12px 'IBM Plex Mono',monospace; color:var(--ink-2); margin-left:auto}
  .layout{flex:1; display:grid; grid-template-columns:1fr 290px; gap:14px; min-height:520px}
  @media (max-width:860px){ .layout{grid-template-columns:1fr} }
  .map-wrap{position:relative; border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); min-height:420px}
  #map{position:absolute; inset:0; background:var(--bg)}
  .side{display:flex; flex-direction:column; gap:14px; min-width:0}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden}
  .card .card-h{padding:11px 14px; border-bottom:1px solid var(--line); font:600 11px 'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3)}
  .quake-list{max-height:430px; overflow-y:auto; scrollbar-width:thin}
  .quake-list button{
    display:flex; gap:10px; align-items:center; width:100%; text-align:left;
    background:none; border:none; border-bottom:1px solid var(--line);
    padding:10px 14px; cursor:pointer; color:var(--ink); font:400 12.5px 'Inter',sans-serif;
  }
  .quake-list button:hover{background:var(--bg)}
  .mag{font:600 13px 'IBM Plex Mono',monospace; min-width:38px; text-align:center; border-radius:7px; padding:3px 0; color:#fff}
  .q-meta{min-width:0}
  .q-place{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500}
  .q-time{color:var(--ink-3); font-size:11px; margin-top:1px}
  .status{padding:10px 14px; font-size:12px; color:var(--ink-2)}
  .status.err{color:#b91c1c}
  .legend-row{display:flex; gap:14px; padding:11px 14px; flex-wrap:wrap}
  .legend-row span{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2)}
  .dot{border-radius:50%}
  .leaflet-popup-content{font:400 13px 'Inter',sans-serif}
  .leaflet-popup-content b{font-weight:600}
  .leaflet-popup-content a{color:var(--accent)}
  html[data-theme="dark"] .leaflet-popup-content-wrapper,
  html[data-theme="dark"] .leaflet-popup-tip{background:#17171a; color:#ededea; box-shadow:0 3px 14px rgba(0,0,0,.5)}
  footer{max-width:1180px; width:100%; margin:0 auto; padding:14px 28px 22px; display:flex; justify-content:space-between; font-size:12px; color:var(--ink-3)}
  footer a{color:var(--ink-2); text-decoration:none; border-bottom:1px solid var(--line)}
  @media (max-width:640px){ header,main,footer{padding-left:16px; padding-right:16px} }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>quake map <span class="mono">live from the usgs</span></h1>
    <p>every earthquake the USGS recorded, plotted live — circle size is magnitude, color is depth.</p>
  </div>
  <button class="theme-btn" id="themeBtn" aria-label="toggle theme">dark</button>
</header>
<main>
  <div class="toolbar">
    <div class="seg" id="feedSeg">
      <button data-feed="hour">past hour</button>
      <button data-feed="day" class="on">past day</button>
      <button data-feed="week">past week</button>
      <button data-feed="month">past month</button>
    </div>
    <div class="slider-wrap">
      <label for="magRange">min mag</label>
      <input type="range" id="magRange" min="0" max="7" step="0.5" value="0">
      <output id="magOut">all</output>
    </div>
    <span class="count" id="count">loading…</span>
  </div>
  <div class="layout">
    <div class="map-wrap"><div id="map"></div></div>
    <div class="side">
      <div class="card">
        <div class="card-h">largest in view</div>
        <div class="quake-list" id="list"></div>
      </div>
      <div class="card">
        <div class="card-h">depth</div>
        <div class="legend-row">
          <span><span class="dot" style="width:10px;height:10px;background:#2f9e44"></span>&lt; 70 km shallow</span>
          <span><span class="dot" style="width:10px;height:10px;background:#e8890c"></span>70–300 km</span>
          <span><span class="dot" style="width:10px;height:10px;background:#c2255c"></span>&gt; 300 km deep</span>
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>
  </div>
</main>
<footer>
  <span>data: <a href="https://earthquake.usgs.gov/earthquakes/feed/" target="_blank" rel="noopener">usgs geojson feed</a> · maps: openstreetmap / carto</span>
  <a href="https://github.com/mjanthony819/quake-map" target="_blank" rel="noopener">github.com/mjanthony819/quake-map</a>
</footer>
<script>
'use strict';
/* ---------- theme ---------- */
const root=document.documentElement;
const savedTheme=localStorage.getItem('quake-theme');
if(savedTheme){root.dataset.theme=savedTheme;}
else if(matchMedia('(prefers-color-scheme: dark)').matches){root.dataset.theme='dark';}
const themeBtn=document.getElementById('themeBtn');
function syncThemeBtn(){themeBtn.textContent=root.dataset.theme==='dark'?'light':'dark';}
syncThemeBtn();

/* ---------- map ---------- */
const TILES={
  light:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  dark:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
};
const map=L.map('map',{worldCopyJump:true, minZoom:2}).setView([20,0],2);
let tileLayer=null;
function applyTiles(){
  if(tileLayer) map.removeLayer(tileLayer);
  tileLayer=L.tileLayer(TILES[root.dataset.theme==='dark'?'dark':'light'],{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains:'abcd', maxZoom:19
  }).addTo(map);
}
applyTiles();
themeBtn.addEventListener('click',()=>{
  root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
  localStorage.setItem('quake-theme',root.dataset.theme); syncThemeBtn(); applyTiles();
});

/* ---------- feed ---------- */
const FEEDS={
  hour:'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson',
  day:'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson',
  week:'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_week.geojson',
  month:'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_month.geojson'
};
let currentFeed='day', minMag=0, quakes=[], layer=L.layerGroup().addTo(map);
const countEl=document.getElementById('count'), listEl=document.getElementById('list'), statusEl=document.getElementById('status');

function depthColor(d){return d<70?'#2f9e44':d<300?'#e8890c':'#c2255c';}
function magRadius(m){return Math.max(4,Math.pow(2,m)*1.4);}
function ago(t){
  const s=(Date.now()-t)/1000;
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

async function load(){
  statusEl.textContent=''; statusEl.classList.remove('err');
  countEl.textContent='loading…';
  try{
    const res=await fetch(FEEDS[currentFeed]);
    if(!res.ok) throw new Error('USGS returned '+res.status);
    const data=await res.json();
    quakes=data.features.map(f=>({
      id:f.id, mag:f.properties.mag, place:f.properties.place||'unknown location',
      time:f.properties.time, url:f.properties.url,
      lon:f.geometry.coordinates[0], lat:f.geometry.coordinates[1], depth:f.geometry.coordinates[2]
    })).filter(q=>q.mag!=null);
    render();
    statusEl.textContent='updated '+new Date().toLocaleTimeString()+' · auto-refreshes every 5 min';
  }catch(e){
    countEl.textContent='feed error';
    statusEl.textContent='could not reach the USGS feed: '+e.message+' — check your connection and reload.';
    statusEl.classList.add('err');
  }
}

function render(){
  const shown=quakes.filter(q=>q.mag>=minMag);
  layer.clearLayers();
  for(const q of shown){
    const c=L.circleMarker([q.lat,q.lon],{
      radius:magRadius(q.mag), color:depthColor(q.depth), weight:1.5,
      fillColor:depthColor(q.depth), fillOpacity:0.35
    });
    c.bindPopup(`<b>M ${q.mag.toFixed(1)}</b> — ${q.place}<br>`+
      `${new Date(q.time).toLocaleString()} · ${q.depth.toFixed(0)} km deep<br>`+
      `<a href="${q.url}" target="_blank" rel="noopener">details on usgs.gov</a>`);
    c.addTo(layer);
  }
  countEl.textContent=shown.length.toLocaleString()+' earthquakes';
  const top=[...shown].sort((a,b)=>b.mag-a.mag).slice(0,25);
  listEl.innerHTML=top.length?top.map((q,i)=>
    `<button data-i="${i}" data-id="${q.id}">
      <span class="mag" style="background:${depthColor(q.depth)}">${q.mag.toFixed(1)}</span>
      <span class="q-meta"><span class="q-place">${q.place}</span><span class="q-time">${ago(q.time)} · ${q.depth.toFixed(0)} km deep</span></span>
    </button>`).join('')
    :'<div class="status">no earthquakes match this filter.</div>';
  listEl.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    const q=shown.find(x=>x.id===b.dataset.id);
    if(q) map.flyTo([q.lat,q.lon],6,{duration:0.8});
  }));
}

document.getElementById('feedSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#feedSeg button').forEach(x=>x.classList.toggle('on',x===b));
  currentFeed=b.dataset.feed;
  load();
});
document.getElementById('magRange').addEventListener('input',e=>{
  minMag=+e.target.value;
  document.getElementById('magOut').textContent=minMag===0?'all':'M '+minMag.toFixed(1)+'+';
  render();
});

load();
setInterval(load,5*60*1000);
</script>
</body>
</html>
